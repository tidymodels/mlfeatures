repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # uv.lock is ~620KB and legitimately committed.
        args: [--maxkb=1024]

  # Regenerates uv.lock when pyproject.toml changes, so a stale lockfile
  # cannot be committed and CI's UV_LOCKED=1 never fails spuriously.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  # ruff, mypy, and pyright run out of the project venv (`uv run`) rather than
  # as pre-commit-managed repos, so the hook, the documented local command, and
  # CI all resolve the same tool versions from uv.lock and cannot disagree.
  - repo: local
    hooks:
      # `--force-exclude` makes ruff honor its `extend-exclude` (the vendored
      # `mlfeatures/_databackend.py`) even for filenames pre-commit passes
      # explicitly; the managed ruff-pre-commit hook added it implicitly.
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      # Both type-checkers, over the same paths CI checks (`extras/` holds the
      # out-of-tree step fixture). They take the paths from the command line
      # and pyproject.toml respectively, so pre-commit passes no filenames.
      - id: mypy
        name: mypy --strict
        entry: uv run mypy mlfeatures extras
        language: system
        files: ^(mlfeatures|extras)/
        pass_filenames: false
      - id: pyright
        name: pyright (strict)
        entry: uv run pyright
        language: system
        files: ^(mlfeatures|extras)/
        pass_filenames: false

  - repo: local
    hooks:
      - id: render-readme
        name: render README.qmd
        entry: uv run --group docs quarto render README.qmd
        language: system
        files: ^README\.qmd$
        pass_filenames: false
