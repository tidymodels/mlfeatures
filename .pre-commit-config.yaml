repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^shoez/
        additional_dependencies:
          - polars>=1.0
          - pandas>=2.0
          - numpy>=1.24
          - scikit-learn>=1.3

  - repo: local
    hooks:
      - id: render-readme
        name: render README.qmd
        entry: uv run --group docs quarto render README.qmd
        language: system
        files: ^README\.qmd$
        pass_filenames: false
