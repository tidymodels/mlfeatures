name: Example
description: Submit a holistic, real-world feature-engineering example to serve as a case study.
title: "[Example]: "
labels: ["example"]
body:
  - type: markdown
    attributes:
      value: |
        Examples serve as real-world case studies for @machow to audit shoez
        in the context of Python modeling workflows.

        **R code is welcome** (e.g. a recipes/tidymodels workflow). @machow can research
        the analogous Python code
  - type: textarea
    id: example-code
    attributes:
      label: Full example code
      description: >-
        A complete, runnable example: dataset, preprocessing/feature engineering, and
        model fitting. Please include everything needed to follow along, not just the recipe.

        (Worst case, though, Michael can fill in details!)
      placeholder: |
        ```r
        library(tidymodels)

        rec <- recipe(outcome ~ ., data = train) |>
          step_normalize(all_numeric_predictors()) |>
          ...
        ```
    validations:
      required: true
  - type: textarea
    id: showcases
    attributes:
      label: What does it showcase?
      description: >-
        e.g. a specific step (step_pca, step_dummy), a preprocessing pattern,
        a tricky interaction between steps, or scikit dynamics.
    validations:
      required: true
  - type: textarea
    id: end-model
    attributes:
      label: What end model does it fit?
      description: >-
        (e.g. logistic regression, xgboost, KNN)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: >-
        Optional — where the example comes from (a book, a blog post, real
        work), known gotchas, or what a faithful shoez translation would need.
    validations:
      required: false
