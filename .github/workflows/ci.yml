name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install exactly what uv.lock says, and fail if it is stale relative to
  # pyproject.toml. Locally the same commands run without this, so a
  # dependency edit just refreshes the lock instead of erroring.
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint & type-check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Python: mypy and pyright verdicts can
        # differ per interpreter version, so check both ends of the range.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      # `extras/` holds the out-of-tree step fixture. Type-checking it is the
      # check that the public API is sufficient to write a plugin under strict
      # mode (issue #197); pyright picks it up via `include` in pyproject.toml.
      - name: mypy --strict
        run: uv run mypy mlfeatures extras
      - name: pyright (strict)
        run: uv run pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # the examples extra too: test_doc_examples.py executes the user_guide/
        # pages, and the getting-started guide plots with seaborn
        run: uv sync --locked --extra examples
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
