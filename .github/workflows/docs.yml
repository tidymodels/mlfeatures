name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          python -m pip install uv
          # --extra examples: the executable examples/ pages import xgboost
          # and pyarrow at docs build
          uv sync --locked --group docs --extra examples

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install chrome-headless-shell
        # Two guide pages set `mermaid-format: svg`, which Quarto pre-renders
        # through headless Chrome. With the runner's full Chrome that render
        # hung indefinitely on most runs: Quarto waits only 3 seconds for the
        # browser's debugging port and then blocks forever on the still-running
        # process (quarto-cli#13704; upstream closed it by moving their own CI
        # to chrome-headless-shell, which starts fast enough to make the window).
        run: quarto install chrome-headless-shell --no-prompt

      - name: Build docs
        # normal builds take ~4-5 min on the runner; the cap turns a render
        # hang into a fast failure instead of a stuck job. The hang seen on
        # 2026-08-13 and 2026-08-24 was the mermaid pre-render (see the
        # chrome-headless-shell step above); if it recurs, flip this step
        # back to the direct-quarto debug mode in git history (014a53c).
        timeout-minutes: 15
        run: uv run great-docs build

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
