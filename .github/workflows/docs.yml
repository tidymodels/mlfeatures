name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          python -m pip install uv
          # --extra examples: the executable examples/ pages import xgboost
          # and pyarrow at docs build
          uv sync --extra examples
          uv pip install great-docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # TEMPORARY (debugging the rendering hang): stage the site with
      # great-docs but kill it before its opaque quarto step finishes, then run
      # quarto directly so per-page render lines land in the log.
      - name: Stage docs (great-docs, killed before/at its quarto render)
        run: timeout 120 uv run great-docs build || true

      - name: Render (direct quarto, page-by-page output)
        timeout-minutes: 15
        run: |
          echo "== chrome on runner:"
          which google-chrome && google-chrome --version || true
          cd great-docs && uv run quarto render

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json
          # temporary: the direct-quarto debug render skips great-docs' post
          # steps, so build-timings.json may not exist
          if-no-files-found: ignore

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    # Skipped until Pages is available for this repo. The repo is currently
    # private, and GitHub Pages publishing requires the repo to be public
    # (or the org to be on a paid plan). Enable by setting the repository
    # variable ENABLE_PAGES=true (Settings -> Secrets and variables ->
    # Actions -> Variables) once Pages is turned on.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: "Preview Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      # Start deployment
      - name: Configure pull release name
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "RELEASE_NAME=pr-${{ github.event.number }}" >> $GITHUB_ENV

      - name: Configure branch release name
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # use branch name, but replace slashes. E.g. feat/a -> feat-a
          echo "RELEASE_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      # Deploy
      - name: Create Github Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ env.RELEASE_NAME }}
          ref: ${{ github.head_ref }}
          logs: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Netlify docs preview
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          npm install -g netlify-cli
          # push main branch to production, others to preview --
          netlify link --name="shoez-preview"
          if [ "${ALIAS}" == "main" ]; then
            netlify deploy --dir=great-docs/_site --alias="main"
          else
            netlify deploy --dir=great-docs/_site --alias="${ALIAS}"
          fi
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ALIAS: ${{ steps.deployment.outputs.env }}

      - name: Update Github Deployment
        uses: bobheadxi/deployments@v1
        if: ${{ !github.event.pull_request.head.repo.fork && always() }}
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          env_url: "https://${{ steps.deployment.outputs.env }}--shoez-preview.netlify.app"
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

  cleanup-preview:
    name: "Cleanup Preview"
    runs-on: ubuntu-latest
    # When a PR is closed (merged or not), tear down its pr-<number>
    # deployment environment so stale deployments don't accumulate.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      deployments: write
    steps:
      - name: Deactivate environment
        uses: bobheadxi/deployments@v1
        with:
          step: deactivate-env
          token: ${{ secrets.GITHUB_TOKEN }}
          env: pr-${{ github.event.number }}
