[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "shoez"
dynamic = ["version"]
description = "A framework for declaring, estimating, and applying feature-engineering pipelines"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Emil Hvitfeldt", email = "emil.hvitfeldt@posit.co"},
    {name = "Max Kuhn", email = "max@posit.co"},
]
keywords = ["machine-learning", "feature-engineering", "preprocessing", "pipelines"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "narwhals>=2.19.0",
    "polars>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "narwhals>=2.19.0",
]

[project.optional-dependencies]
yaml = [
    "pyyaml",
]
# pandas can only represent narwhals' `Date` dtype through a pyarrow-backed
# column (`pd.ArrowDtype`); `StepDateFeatures` declares this extra via
# `required_pkgs()` so a missing pyarrow surfaces as a friendly
# `MissingDependencyError` instead of a cryptic narwhals cast failure.
pyarrow = [
    "pyarrow>=13.0.0",
]
# `StepOrderNorm` uses `scipy.stats.norm.ppf` for the inverse-normal-CDF step
# of its rank-to-normal-quantile map; declared via `required_pkgs()` so a
# missing scipy surfaces as a friendly `MissingDependencyError`.
scipy = [
    "scipy>=1.10",
]
# `StepHoliday` uses the `holidays` package's country calendars to check
# whether a date is a named holiday; declared via `required_pkgs()` so a
# missing install surfaces as a friendly `MissingDependencyError`.
holidays = [
    "holidays>=0.40",
]
# `shoez.testing` (the StepConformanceTest suite) imports pytest, so a plugin
# author running the step contract needs it. The rest of the package does not.
test = [
    "pytest>=7.0",
]
dev = [
    # numpy 2.5 ships stubs that break strict type-checking: its `__init__.pyi`
    # uses the 3.12 `type` statement (rejected by mypy at our 3.10 target) and
    # its reduction overloads (`all`/`any`/`unique`/`where`) resolve to partially
    # unknown types under pyright strict. Cap the type-checked/CI environment
    # below 2.5 until the stubs are fixed; runtime is unaffected (tests pass on
    # 2.5) so the package's own `numpy>=1.24` floor stays open for users.
    "numpy<2.5",
    "pytest>=7.0",
    "pytest-cov",
    "syrupy",
    # Pinned: CI installs the dev extra unpinned, so a ruff release can turn a
    # green PR red without a code change. 0.16 added formatting of Python code
    # blocks inside Markdown; upgrade deliberately, not by drift.
    "ruff==0.15.15",
    "mypy>=1.0.0",
    "pyright>=1.1.407",
    "build>=0.7",
    "twine>=3.4",
    "pyyaml",
    "types-PyYAML",
    # Lets pandas represent narwhals' `Date` dtype (via `pd.ArrowDtype`), so
    # `StepDateFeatures`'s pandas-backed tests can actually construct one.
    "pyarrow>=13.0.0",
    # `StepOrderNorm`'s tests exercise the real scipy dependency.
    "scipy>=1.10",
    # `StepHoliday`'s tests exercise the real holidays dependency.
    "holidays>=0.40",
    # `tests/test_data.py`'s packaging guard reads pyproject.toml; `tomllib` is
    # stdlib from 3.11, so 3.10 needs this backport.
    "tomli>=2.0 ; python_version < '3.11'",
]

examples = [
    # the executable examples/ pages; polars/pandas/scikit-learn ship with the
    # core dependencies already
    "xgboost>=2.0",
    "pyarrow>=15",  # xgboost's polars ingestion path requires it
    "seaborn>=0.13",  # pairplots in the getting-started guide
]

[project.urls]
Homepage = "https://github.com/tidymodels/shoez"
Repository = "https://github.com/tidymodels/shoez"
"Bug Tracker" = "https://github.com/tidymodels/shoez/issues"

[project.entry-points."shoez.steps"]
# Third-party step plugins register here

[dependency-groups]
docs = [
    "great-docs>=0.12 ; python_full_version >= '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shoez*"]

[tool.setuptools.package-data]
shoez = ["py.typed", "data/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `extras/` holds the out-of-tree step fixture (`shoez_demo_step`), which lives
# outside `tests/` because `tests/` is excluded from both type-checkers and the
# whole point of the fixture is that it type-checks under strict mode.
pythonpath = ["extras"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["shoez"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    # Vendored verbatim from https://github.com/machow/databackend (MIT) — kept
    # byte-identical to upstream, so it is not linted/formatted or type-checked
    # here.
    "shoez/_databackend.py",
    # The design and plan docs hold illustrative pseudo-code, not source; ruff
    # >=0.16 formats Python blocks inside Markdown and would rewrite it.
    "*.md",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E402",
    "E501",
    "E203",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "E402"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# `extras` holds the out-of-tree step fixture; it is type-checked precisely
# because proving a plugin can be written under strict mode is its job.
include = ["shoez", "extras"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/build",
    "**/dist",
    "tests",
    # Vendored verbatim from machow/databackend (MIT); not type-checked here.
    "shoez/_databackend.py",
    # Test-support code: it drives pandas frames and pytest directly, neither of
    # which ships stubs, so strict mode reports their symbols as partially
    # unknown. Excluded on the same grounds as `tests/`; mypy still checks it.
    "shoez/testing.py",
]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["pandas", "polars", "narwhals", "narwhals.*"]
ignore_missing_imports = true

# scikit-learn's base classes resolve to Any under strict mode; allow the sklearn
# adapter in shoez.compat to subclass them without tripping disallow_subclassing_any.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shoez.compat"]
disallow_subclassing_any = false

# Vendored verbatim from machow/databackend (MIT); its dynamic ABCMeta pattern is
# not worth diverging from upstream to satisfy strict mode, so skip its errors.
[[tool.mypy.overrides]]
module = ["shoez._databackend"]
ignore_errors = true
