# User Guide Structure
# --------------------
# Pages in user_guide/ are auto-discovered, but the implicit order is by
# filename, which would put a new page ahead of getting-started.qmd. The
# explicit form below fixes the order: the tour first, then the pages that
# only matter once you are using a particular backend or ecosystem.
user_guide:
  - section: "User Guide"
    contents:
      - getting-started.qmd
      - common-step-arguments.qmd
      - polars-extension.qmd
      - sklearn-pipelines.qmd
      - vocabulary.qmd

# API Reference Structure
# -----------------------
# Customize the sections below to organize your API documentation.
# - Reorder items within a section to change their display order
# - Move items between sections or create new sections
# - Use 'members: false' to exclude methods from documentation
# - Add 'desc:' to sections for descriptions

reference:
  - title: Recipes
    desc: >-
      Build a recipe, then fit and apply it. The Recipe class and its methods
      are flattened into this section so each method appears on the reference
      index.
    # Recipe is `members: false` (class docstring only on its own page); its
    # methods are listed explicitly below so they render as their own rows in
    # this section's index table. great-docs has no section-level `flatten`
    # option, so the methods must be enumerated by hand.
    contents:
      - name: Recipe
        members: false
      - Recipe.add
      - Recipe.fit
      - Recipe.set_roles
      - Recipe.update_role_requirements
      - Recipe.summary

  - title: "Steps: numeric features"
    desc: Rescale, expand, or derive new numeric columns.
    contents:
      - name: StepNormalize
        members: false
      - name: StepOrderNorm
        members: false
      - name: StepRange
        members: false
      - name: StepLog
        members: false
      - name: StepPolynomial
        members: false
      - name: StepClassDistance
        members: false
      - name: StepGeoDistance
        members: false
      - name: StepIntercept
        members: false
      - name: StepInteract
        members: false

  - title: "Steps: categorical features"
    desc: Encode nominal columns as numeric ones.
    contents:
      - name: StepDummy
        members: false
      - name: StepOneHot
        members: false
      - name: StepOther
        members: false

  - title: "Steps: date and datetime features"
    desc: Expand Date and Datetime columns into calendar-part feature columns.
    contents:
      - name: StepDateFeatures
        members: false
      - name: StepDatetimeFeatures
        members: false
      - name: StepHoliday
        members: false

  - title: "Steps: missing data"
    desc: Impute missing values, or give them an explicit level.
    contents:
      - name: StepImputeMean
        members: false
      - name: StepImputeMedian
        members: false
      - name: StepImputeMode
        members: false
      - name: StepUnknown
        members: false
      - name: StepIndicateNa
        members: false

  - title: "Steps: dimensionality reduction"
    desc: Reduce dimensionality, or filter columns that carry no signal.
    contents:
      - name: StepDropZeroVariance
        members: false
      - name: StepDropNearZeroVariance
        members: false
      - name: StepPca
        members: false
      - name: StepPls
        members: false
      - name: StepDropCorr
        members: false
      - name: StepDrop
        members: false

  - title: "Steps: general expressions"
    desc: >-
      Arbitrary row filters and column computations; escape hatches rather than
      a named feature-engineering method.
    contents:
      - name: StepFilter
        members: false
      - name: StepMutate
        members: false

  - title: Fitted recipes
    desc: >-
      What Recipe.fit() returns: an immutable, fitted pipeline you can apply to
      new data. Serialization methods are listed under Serialization below.
    # Same flattening pattern as Recipes.
    contents:
      - name: FittedRecipe
        members: false
      - FittedRecipe.transform
      - FittedRecipe.summary

  - title: Schema
    desc: >-
      The column-lineage DAG a fitted recipe maintains: per-column provenance
      and dtype history, plus the queries that back has_source.
    contents:
      - name: Schema
        members: false
      - Schema.summary
      - Schema.columns_from_source
      - Schema.parents
      - Schema.ancestors
      - name: ColumnNode
        members: false

  - title: Serialization
    desc: >-
      Save a fitted recipe to a diffable JSON or YAML format and reload it, or
      strip fit-only artifacts with minimize(). See design/serialization.md.
    contents:
      - name: to_dict
      - name: from_dict
      - name: to_json
      - name: from_json
      - name: to_yaml
      - name: from_yaml
      - name: minimize
      - FittedRecipe.to_dict
      - FittedRecipe.from_dict
      - FittedRecipe.to_json
      - FittedRecipe.from_json
      - FittedRecipe.to_yaml
      - FittedRecipe.from_yaml
      - FittedRecipe.minimize

  - title: Interop
    desc: >-
      Adapters for using recipes inside other ecosystems.
    contents:
      - name: RecipeTransformer
        members: false

  - title: Types & selectors
    desc: >-
      Selector DSL and the schema/type vocabulary that steps are written
      against.
    contents:
      - name: Selectors
        members: true
      - Selector
      - name: ColSchema
        members: false
      - name: SchemaInfo
        members: false
      - name: Roles
        members: false
      - name: Mode
        members: false
      - name: KeepOriginals
        members: false
      - KeepOriginals.for_mode
      - KeepOriginals.fixed_value
      - name: Ptype
        members: false
      - Ptype.check
      - DataFrame
      - Frame
      - ANY_DTYPE
      - NUMERIC_DTYPES
      - AcceptedDtypes

  - title: Developing
    desc: >-
      The abstract Step base class and its lifecycle methods, for authoring new
      steps. Flattened so each method appears on the reference index.
    # Same pattern as Recipes: Step is `members: false` (class docstring only on
    # its own page) and its methods are enumerated by hand so they render as
    # their own rows in this section's index table.
    contents:
      - name: Step
        members: false
      - Step.fit
      - Step.transform
      - Step.resolve_selection
      - Step.update_roles
      - Step.schema_in
      - Step.schema_out
      - Step.output_parents
      - Step.accepts_dtypes
      - Step.produces_sparse
      - Step.produced_columns
      - Step.keep_original_cols
      - Step.required_pkgs
      - Step.check_required_pkgs
      - Step.to_state
      - Step.from_state
      - Step.minimize
      - name: RowOp
        members: false
      - name: StepError
        members: false

# Site URL
# --------
# Canonical address of the deployed documentation site.
# Required for subdirectory deployments, skills page install commands,
# .well-known/ discovery, and sitemaps.
site_url: "https://tidymodels.github.io/shoez/"

# Site Settings
# -------------
# site:
#   theme: flatly              # Quarto theme (default: flatly)
#   toc: true                  # Show table of contents (default: true)
#   toc-depth: 2               # TOC heading depth (default: 2)
#   toc-title: On this page    # TOC title (default: "On this page")

# Jupyter Kernel
# --------------
# Jupyter kernel to use for executing code cells in .qmd files.
# This is set at the project level so it applies to all pages, including
# auto-generated API reference pages. Can be overridden in individual .qmd
# file frontmatter if needed for special cases.
jupyter: python3

# CLI Documentation
# -----------------
# cli:
#   enabled: true              # Enable CLI documentation
#   module: my_package.cli     # Module containing Click commands
#   name: cli                  # Name of the Click command object
